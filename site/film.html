const SCALE=.4,R=DATA.geometry.r*SCALE,H=DATA.geometry.h*SCALE,FLOOR=590,X0=1110,WALK=3.94,SPEED=340,STEP=140;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const ease=v=>{v=clamp(v);return v*v*v*(10+v*(-15+6*v));};
const mix=(a,b,t)=>a+(b-a)*t,rad=a=>a*Math.PI/180;
const f=v=>String(+v.toFixed(5)),pt=p=>p.map(f).join(' ');
const rotate=(p,a)=>[p[0]*Math.cos(a)-p[1]*Math.sin(a),p[0]*Math.sin(a)+p[1]*Math.cos(a)];
const add=(a,b)=>[a[0]+b[0],a[1]+b[1]],lerp=(a,b,t)=>[mix(a[0],b[0],t),mix(a[1],b[1],t)];
function keys(t,k){if(t<=k[0][0])return k[0][1];for(let i=1;i<k.length;i++)if(t<=k[i][0])return mix(k[i-1][1],k[i][1],ease((t-k[i-1][0])/(k[i][0]-k[i-1][0])));return k.at(-1)[1];}
function distance(t){const u=Math.max(0,t-WALK),r=.44;if(u>=r)return SPEED*(u-r/2);const q=u/r;return SPEED*r*(q*q*q-.5*q*q*q*q);}
function layout(key){const v=variants[key],face=DATA.face,dir=v.take==='steady'?1:-1,gap=v.end==='joined'?face.contact.gap:face.gap;
  const width=face.half.width+gap+face.steady.width,x=dir===1?975-width:625;
  return {face,dir,gap,width,x,halfX:x,steadyX:x+face.half.width+gap,remaining:v.take==='half'?'steady':'half'};
}
function footAt(d,offset){const q=d/STEP+offset,k=Math.floor(q),u=q-k,x=X0+(k-offset)*STEP+STEP*.30;
  if(u<.62)return{x,y:FLOOR-11,stance:true,cycle:k};
  const s=(u-.62)/.38;return{x:x+STEP*ease(s),y:FLOOR-11-24*Math.sin(Math.PI*s)**2,stance:false,cycle:k};
}
function ik(a,b,l1,l2,bend){const dx=b[0]-a[0],dy=b[1]-a[1],raw=Math.hypot(dx,dy),d=clamp(raw,Math.abs(l1-l2)+.001,l1+l2-.001),ux=raw>1e-8?dx/raw:0,uy=raw>1e-8?dy/raw:1;
  const along=(l1*l1-l2*l2+d*d)/(2*d),height=Math.sqrt(Math.max(0,l1*l1-along*along));
  return{a,k:[a[0]+along*ux-bend*height*uy,a[1]+along*uy+bend*height*ux],b,reach:raw,limit:l1+l2};
}
function telescope(a,b,l1,l2,bend,extension){const full=ik(a,b,l1,l2,bend);return{...full,k:lerp(a,full.k,extension),b:lerp(a,b,extension),reach:full.reach*extension,limit:full.limit*extension};}
function legAt(a,b,dir,extension){

function letterPose(g,angle){const pivot=angle<0?0:g.width,a=rad(angle),corners=[[0,g.top],[g.width,g.top],[0,g.bottom],[g.width,g.bottom]],r=corners.map(p=>rotate([p[0]-pivot,p[1]-g.bottom],a));
